<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signup & Signin</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/matrimony/profile2.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PQLTG22ZFC"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-PQLTG22ZFC');
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            padding-top: 54px; /* Prevent content from being hidden under the navbar */
        }
        
        /* Navbar */
        .navbar {
            display: flex;
            width: 100%;
            height: 100px;
            align-items: center;
            background-color: #002d50;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        
        .navbar-item.left {
            display: flex;
            align-items: center;
            padding-left: 15px;
            width: 100%;
        }
        
        .navbar-links {
            display: flex;
            list-style-type: none;
            gap: 22px;
        }
        
        .navbar-links a {
            text-decoration: none;
            color: white;
            padding: 8px 11px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        /* Mobile View */
        @media (max-width: 768px) {
            .navbar-links {
                flex-direction: column;
                display: none;
                position: absolute;
                top: 10px;
                left: 130px;
                width: 50%;
                text-align: center;
                background-color: #002d50;
            }
            .navbar-links.show {
                display: flex;
                margin-top: -10px;
            }
            .menu-btn {
                display: block;
                margin-bottom: 50px;
            }
        }
        
        /* Form Styling */
        .container1 {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            margin: 50px auto;
            border: 2px solid #00bfa6;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .signup-form1 h2 {
            text-align: center;
        }
        
        .signup-form1 input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #00bfa6;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        #signup {
            background-color: #005b66;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            margin: 20px auto 0;
        }
        
        #signup:hover {
            background-color: #00414d;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-item left">
            <img src="img/Alisom Logo .png" alt="Logo" class="logo">
        </div>
        <div>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <ul class="navbar-links">
                <li><a href="index.html">Login</a></li>
                <li><a href="Add_client.html">Add Client</a></li>
                <li><a href="Due-Payment.html">Due Payment</a></li>
                <li><a href="search.html">Search</a></li>
                <li><a href="po-and-customername.html">Name & PO Number</a></li>
            </ul>
        </div>
    </header>
    
    <div class="container1">
        <form action="#" class="signup-form1" id="signupForm1">
            <h2 class="form-heading">Signup</h2>
            <label for="signup-firstname">First Name</label>
            <input type="text" name="firstname" id="signup-firstname" placeholder="First Name" required>
            
            <label for="signup-lastname">Last Name</label>
            <input type="text" name="lastname" id="signup-lastname" placeholder="Last Name" required>
            
            <label for="signup-email">Email</label>
            <input type="email" name="email" id="signup-email" placeholder="Email" required>
            
            <label for="signup-password">Password</label>
            <input type="password" name="password" id="signup-password" placeholder="Password" required>
            
            <label for="signup-confirm-password">Confirm Password</label>
            <input type="password" name="confirm-password" id="signup-confirm-password" placeholder="Confirm Password" required>
            
            <button type="submit" id="signup">Signup</button>
        </form>
    </div>
    
    <script>
        function toggleMenu() {
            document.querySelector('.navbar-links').classList.toggle('show');
        }
    </script>
</body>
</html>
